# OpenTelemetry Collector for observability stack A:
#   traces -> Tempo, logs -> Loki, metrics -> Prometheus (OTLP receiver).
# Request metrics (rate, errors, latency) are derived from spans by the span_metrics connector.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTEL_COLLECTOR_HOST}:${env:OTEL_COLLECTOR_PORT_GRPC}
      http:
        endpoint: ${env:OTEL_COLLECTOR_HOST}:${env:OTEL_COLLECTOR_PORT_HTTP}
        cors:
          allowed_origins:
            - "http://*"
            - "https://*"
          allowed_headers:
            - "content-type"
            - "traceparent"
            - "baggage"
  http_check/frontend-proxy:
    targets:
      - endpoint: http://${env:FRONTEND_PROXY_ADDR}
  nginx:
    endpoint: http://${env:IMAGE_PROVIDER_HOST}:${env:IMAGE_PROVIDER_PORT}/status
    collection_interval: 15s
  # Per-container CPU, memory and restarts.
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 15s
    metrics:
      container.cpu.throttling_data.periods:
        enabled: true
      container.cpu.throttling_data.throttled_periods:
        enabled: true
      container.memory.rss:
        enabled: true
      container.restarts:
        enabled: true
      container.uptime:
        enabled: true
  redis:
    endpoint: "valkey-cart:6379"
    username: "valkey"
    collection_interval: 15s
  postgresql:
    endpoint: ${env:POSTGRES_HOST}:${env:POSTGRES_PORT}
    username: monitoring_user
    password: ${env:POSTGRES_MONITORING_PASSWORD}
    collection_interval: 15s
    tls:
      insecure: true
  kafkametrics:
    brokers:
      - ${env:KAFKA_ADDR}
    scrapers:
      - brokers
      - topics
      - consumers
    collection_interval: 15s
  prometheus/ad:
    config:
      scrape_configs:
        - job_name: ad
          scrape_interval: 15s
          static_configs:
            - targets: ["ad:${env:AD_PROMETHEUS_PORT}"]

processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource_detection:
    detectors: [env, docker]
  # SDK self-observability metrics arrive with empty data points, which Prometheus rejects.
  filter/drop_sdk_metrics:
    error_mode: ignore
    metrics:
      metric:
        - 'IsMatch(name, "^otel\\.sdk\\.")'
  transform/sanitize_spans:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set_semconv_span_name("1.43.0", "original_span_name")
  # Collector-side redaction is a safety net; services should not emit these in the first place.
  transform/redact_sensitive_data:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "demo.payment.card_cvv") where attributes["demo.payment.card_cvv"] != nil
          - set(attributes["user.hash"], SHA256(attributes["user.email"])) where attributes["user.email"] != nil
          - delete_key(attributes, "user.email") where attributes["user.email"] != nil
          - replace_pattern(attributes["demo.payment.card_number"], "^\\d{4}-\\d{4}-\\d{4}-", "****-****-****-") where attributes["demo.payment.card_number"] != nil
  redaction:
    allow_all_keys: true
    ignored_keys:
      - demo.payment.card_number
    blocked_key_patterns:
      - "demo\\.payment\\.card_pin"
      - "password"
      - "secret"
    summary: info

connectors:
  span_metrics:
    metrics_flush_interval: 15s

exporters:
  otlp_grpc/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true
    sending_queue:
      batch:
  otlp_http/prometheus:
    endpoint: "http://prometheus:9090/api/v1/otlp"
    tls:
      insecure: true
    sending_queue:
      batch:
  otlp_http/loki:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true
    sending_queue:
      batch:

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource_detection, memory_limiter, transform/sanitize_spans, transform/redact_sensitive_data, redaction]
      exporters: [otlp_grpc/tempo, span_metrics]
    metrics:
      receivers: [otlp, span_metrics, docker_stats, http_check/frontend-proxy, nginx, redis, postgresql, kafkametrics, prometheus/ad]
      processors: [resource_detection, memory_limiter, filter/drop_sdk_metrics]
      exporters: [otlp_http/prometheus]
    logs:
      receivers: [otlp]
      processors: [resource_detection, memory_limiter]
      exporters: [otlp_http/loki]
