# Metrics arrive by push: the OTel Collector sends OTLP to /api/v1/otlp and Tempo's metrics
# generator remote-writes service-graph metrics. Prometheus only scrapes itself and Alertmanager.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.name
    - service.namespace
    - service.version
    - service.instance.id
    - service.criticality
    - deployment.environment.name
    - container.name
    - host.name
    - postgresql.database.name
    - postgresql.table.name
    - kafka.cluster.alias
    # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/connector/spanmetricsconnector#known-limitation-the-single-writer-principle
    - collector.instance.id

storage:
  tsdb:
    out_of_order_time_window: 30m
