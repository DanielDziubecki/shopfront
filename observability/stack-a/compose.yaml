# Observability stack A: Prometheus + Alertmanager + Loki + Tempo + Grafana.
# Layer on top of the root compose file:
#   docker compose -f compose.yaml -f observability/stack-a/compose.yaml up -d
# Relative paths resolve from the repository root (the first compose file's directory).
# UIs bind to localhost only.

x-default-logging: &logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./observability/stack-a/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    deploy:
      resources:
        limits:
          memory: 600M
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT}:9090"
    logging: *logging

  alertmanager:
    image: ${ALERTMANAGER_IMAGE}
    container_name: alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/stack-a/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT}:9093"
    logging: *logging

  loki:
    image: ${LOKI_IMAGE}
    container_name: loki
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./observability/stack-a/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          memory: 400M
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOKI_PORT}:3100"
    logging: *logging

  tempo:
    image: ${TEMPO_IMAGE}
    container_name: tempo
    command:
      - -config.file=/etc/tempo/tempo.yml
    user: 0:0
    volumes:
      - ./observability/stack-a/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    deploy:
      resources:
        limits:
          memory: 600M
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TEMPO_PORT}:3200"
    logging: *logging

  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
    volumes:
      - ./observability/stack-a/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/stack-a/grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          memory: 400M
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    depends_on:
      - prometheus
      - alertmanager
      - loki
      - tempo
    logging: *logging

  otel-collector:
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
