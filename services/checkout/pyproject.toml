[project]
name = "shopfront-checkout"
version = "1.0.0"
description = "Places orders: prices the cart, quotes shipping, charges the card and publishes the order."
requires-python = ">=3.13"
dependencies = [
    "shopkit",
    "aiokafka>=0.12",
    "opentelemetry-instrumentation-aiokafka>=0.51b0",
]

[project.scripts]
checkout = "checkout.main:run"

[tool.uv.sources]
shopkit = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "checkout"
