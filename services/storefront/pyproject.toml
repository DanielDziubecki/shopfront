[project]
name = "shopfront-storefront"
version = "1.0.0"
description = "Public web front: a minimal HTML shop and the JSON API used by browsers."
requires-python = ">=3.13"
dependencies = ["shopkit"]

[project.scripts]
storefront = "storefront.main:run"

[tool.uv.sources]
shopkit = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "storefront"
