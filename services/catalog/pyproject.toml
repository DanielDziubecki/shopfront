[project]
name = "shopfront-catalog"
version = "1.0.0"
description = "Product catalog: products, descriptions and prices."
requires-python = ">=3.13"
dependencies = [
    "shopkit",
    "asyncpg>=0.30",
    "opentelemetry-instrumentation-asyncpg>=0.51b0",
]

[project.scripts]
catalog = "catalog.main:run"

[tool.uv.sources]
shopkit = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "catalog"
