[project]
name = "shopfront-payment"
version = "1.0.0"
description = "Card payments: validation, tokenization and charges."
requires-python = ">=3.13"
dependencies = ["shopkit"]

[project.scripts]
payment = "payment.main:run"

[tool.uv.sources]
shopkit = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "payment"
