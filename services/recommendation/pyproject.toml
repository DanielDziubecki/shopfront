[project]
name = "shopfront-recommendation"
version = "1.0.0"
description = "Product recommendations based on product similarity."
requires-python = ">=3.13"
dependencies = ["shopkit"]

[project.scripts]
recommendation = "recommendation.main:run"

[tool.uv.sources]
shopkit = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "recommendation"
