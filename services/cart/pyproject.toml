[project]
name = "shopfront-cart"
version = "1.0.0"
description = "Shopping carts, stored in Valkey."
requires-python = ">=3.13"
dependencies = [
    "shopkit",
    "redis>=5.2",
    "opentelemetry-instrumentation-redis>=0.51b0",
]

[project.scripts]
cart = "cart.main:run"

[tool.uv.sources]
shopkit = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cart"
