# Service-level alerts for Shopfront. Symptom-based: each alert describes what users or
# downstream systems experience, not a suspected cause.
#
# Request metrics come from the OTel Collector's span_metrics connector: one series per
# service, span name, span kind and status. "Requests" are server spans, plus consumer spans
# for queue consumers.

groups:
  - name: shopfront-slo-recording
    interval: 15s
    rules:
      - record: service:requests:rate2m
        expr: |
          sum by (service_name) (
            rate(traces_span_metrics_calls_total{span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[2m])
          )
      - record: service:errors:rate2m
        expr: |
          sum by (service_name) (
            rate(traces_span_metrics_calls_total{span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER", status_code="STATUS_CODE_ERROR"}[2m])
          )
      - record: service:error_ratio:rate2m
        expr: |
          (service:errors:rate2m or service:requests:rate2m * 0)
            / service:requests:rate2m
      - record: service:latency_p95_ms:rate2m
        expr: |
          histogram_quantile(0.95,
            sum by (service_name, le) (
              rate(traces_span_metrics_duration_milliseconds_bucket{span_kind="SPAN_KIND_SERVER"}[2m])
            )
          )
      - record: service:requests:rate5m
        expr: |
          sum by (service_name) (
            rate(traces_span_metrics_calls_total{span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[5m])
          )

  - name: shopfront-slo
    rules:
      # Error ratio alerts need a minimum request rate so a handful of requests can't page.
      - alert: StorefrontErrorRateHigh
        expr: |
          service:error_ratio:rate2m{service_name="storefront"} > 0.05
            and service:requests:rate2m{service_name="storefront"} > 0.1
        for: 1m
        labels:
          severity: page
          slo: availability
        annotations:
          summary: "Shop requests are failing"
          description: "{{ $value | humanizePercentage }} of storefront requests failed over the last 2 minutes (SLO: under 5%)."
      - alert: StorefrontLatencyHigh
        expr: service:latency_p95_ms:rate2m{service_name="storefront"} > 1000
        for: 2m
        labels:
          severity: page
          slo: latency
        annotations:
          summary: "The shop is slow"
          description: "p95 storefront latency is {{ $value | humanize }} ms (SLO: under 1000 ms)."
      - alert: CheckoutErrorRateHigh
        expr: |
          service:error_ratio:rate2m{service_name="checkout"} > 0.05
            and service:requests:rate2m{service_name="checkout"} > 0.02
        for: 1m
        labels:
          severity: page
          slo: availability
        annotations:
          summary: "Orders are failing at checkout"
          description: "{{ $value | humanizePercentage }} of checkout requests failed over the last 2 minutes (SLO: under 5%)."
      - alert: CheckoutLatencyHigh
        expr: service:latency_p95_ms:rate2m{service_name="checkout"} > 1500
        for: 1m
        labels:
          severity: page
          slo: latency
        annotations:
          summary: "Placing an order is slow"
          description: "p95 checkout latency is {{ $value | humanize }} ms (SLO: under 1500 ms)."
      - alert: CartErrorRateHigh
        expr: |
          service:error_ratio:rate2m{service_name="cart"} > 0.05
            and service:requests:rate2m{service_name="cart"} > 0.05
        for: 1m
        labels:
          severity: page
          slo: availability
        annotations:
          summary: "Cart requests are failing"
          description: "{{ $value | humanizePercentage }} of cart requests failed over the last 2 minutes (SLO: under 5%)."
      - alert: CartLatencyHigh
        expr: service:latency_p95_ms:rate2m{service_name="cart"} > 500
        for: 1m
        labels:
          severity: page
          slo: latency
        annotations:
          summary: "Cart is slow"
          description: "p95 cart latency is {{ $value | humanize }} ms (SLO: under 500 ms)."
      - alert: CatalogErrorRateHigh
        expr: |
          service:error_ratio:rate2m{service_name="catalog"} > 0.02
            and service:requests:rate2m{service_name="catalog"} > 0.1
        for: 2m
        labels:
          severity: ticket
          slo: availability
        annotations:
          summary: "Product catalog requests are failing"
          description: "{{ $value | humanizePercentage }} of catalog requests failed over the last 2 minutes (SLO: under 2%)."
      - alert: RecommendationLatencyHigh
        expr: service:latency_p95_ms:rate2m{service_name="recommendation"} > 500
        for: 2m
        labels:
          severity: ticket
          slo: latency
        annotations:
          summary: "Recommendations are slow"
          description: "p95 recommendation latency is {{ $value | humanize }} ms (SLO: under 500 ms)."
      - alert: ShippingErrorRateHigh
        expr: |
          service:error_ratio:rate2m{service_name="shipping"} > 0.05
            and service:requests:rate2m{service_name="shipping"} > 0.02
        for: 1m
        labels:
          severity: page
          slo: availability
        annotations:
          summary: "Shipping quotes are failing"
          description: "{{ $value | humanizePercentage }} of shipping requests failed over the last 2 minutes (SLO: under 5%)."
      - alert: OrdersBacklogHigh
        expr: sum by (rabbitmq_queue_name) (rabbitmq_message_current{rabbitmq_queue_name="fulfillment.orders", state="ready"}) > 20
        for: 2m
        labels:
          severity: ticket
          slo: freshness
        annotations:
          summary: "Placed orders are piling up unprocessed"
          description: "{{ $value }} orders are waiting in {{ $labels.rabbitmq_queue_name }}."

      - alert: OrdersDeadLettered
        expr: sum by (rabbitmq_queue_name) (rabbitmq_message_current{rabbitmq_queue_name="fulfillment.orders.dead", state="ready"}) > 0
        for: 1m
        labels:
          severity: ticket
          slo: correctness
        annotations:
          summary: "Orders were rejected by fulfillment"
          description: "{{ $value }} order messages are in the dead-letter queue {{ $labels.rabbitmq_queue_name }}."

      - alert: StorefrontTrafficSurge
        expr: |
          service:requests:rate5m{service_name="storefront"}
            > 3 * avg_over_time(service:requests:rate5m{service_name="storefront"}[30m] offset 10m)
        for: 2m
        labels:
          severity: ticket
          slo: capacity
        annotations:
          summary: "Shop traffic is far above normal"
          description: "The storefront receives {{ $value | humanize }} requests/s, more than 3x its recent average."

      - alert: ContainerRestarting
        expr: increase(container_restarts_total[10m]) >= 2
        labels:
          severity: ticket
          slo: availability
        annotations:
          summary: "A container keeps restarting"
          description: "{{ $labels.container_name }} restarted {{ $value | humanize }} times in 10 minutes."
